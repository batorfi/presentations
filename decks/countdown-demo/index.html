  <script>
    Deck.configure({
      title: "Countdown lobby — 10 visuals",
      theme: "light",                      // "light" | "dark"
      transition: "slide",                 // "slide" | "fade" | "none"
      countdown: { author: "Zsolt Batorfi", duration: "demo", minutes: 1 },   // lobby countdown before the talk: press K (or open with ?lobby)
      timer: { minutes: 10 },                 // new-deck.py --minutes sets this
            // background: "aurora",             // optional deck-wide animated background (docs/04-plugins.md)
      sections: [
        { id: "opening", label: "Opening" },
        { id: "visuals", label: "Visuals" },
        { id: "use", label: "Use it" },
      ],
    });

    // Deck-specific: preview a visual full screen for 45 s (button click or key P).
    window.cdPreview = (name) => {
      const c = Deck.countdown;
      c.reset(); c.visual(name); c.setRemaining(45); c.start(); c.open();
    };
    window.cdPreviewBind = (ctx, fixed) => {
      ctx.$$("[data-v]").forEach((b) => b.addEventListener("click", () => cdPreview(fixed || b.dataset.v)));
    };
    Deck.on("ready", () => Deck.addKeys(["w"], () => {
      const b = Deck.context(Deck.state.index).$$(".cd-play")[0];
      if (b) cdPreview(b.dataset.v);
    }, "Preview this countdown visual", "View"));
  </script>
